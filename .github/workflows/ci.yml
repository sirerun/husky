name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Build all products
        run: swift build
      - name: Run tests
        run: swift test
